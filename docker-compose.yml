services:
  frontend:
    build: ./apps/frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./apps/backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-biblioteca}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu entorno o en un archivo .env junto a docker-compose.yml}@db:5432/${POSTGRES_DB:-biblioteca}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en tu entorno o en un archivo .env junto a docker-compose.yml}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/api/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu entorno o en un archivo .env junto a docker-compose.yml}
    volumes:
      - pgdata18:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata18:
  uploads:
